# Dependabot configuration.
#
# Weekly cadence keeps PRs manageable on a small repo. Three update jobs:
#
#   1. Bun at the repo root — the crew CLI's deps (typescript, biome,
#      bun types, etc.). Native Bun support keeps bun.lock in sync.
#   2. Bun in `site/` — the Next.js landing site.
#   3. github-actions — the workflows under `.github/workflows/`.
#
# Security alerts and security updates have separate repository settings.
# Native Bun currently supports these scheduled version updates, not automatic
# security-update PRs.

version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: "bun"
    directory: "/site"
    # React and its renderer require matching runtime versions.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(site)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
