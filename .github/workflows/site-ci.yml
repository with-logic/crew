name: Site CI

# Runs on every PR and push to main, regardless of which paths
# changed. Branch protection requires this job's success context, so
# path-filtering it would let CLI-only PRs slip through unblocked.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs on the same ref when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Build first: Next regenerates `next-env.d.ts` (which declares
      # type signatures for static asset imports like `.png`). With
      # that file in place, typecheck + lint work downstream. Locally
      # you never notice because prior dev/build runs left the file
      # on disk; on a fresh CI checkout it isn't there.
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
