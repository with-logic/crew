name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new push arrives.
# Saves CI minutes on fast follow-ups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # Ubuntu is plenty for `bun run check`; platform schedulers are
    # stubbed in tests, and release builds cross-compile from Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck, lint, test (with coverage)
        run: bun run check
        env:
          # The test suite builds local git repos and clones them via
          # `file://` URLs. Git ≥2.38 disables the `file` protocol by
          # default (CVE-2022-39253 mitigation); the tests are safe
          # because every repo is freshly-created under `os.tmpdir()`,
          # so we re-enable it here. macOS dev machines ship older
          # git defaults and don't hit this.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "protocol.file.allow"
          GIT_CONFIG_VALUE_0: "always"
