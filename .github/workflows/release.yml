name: Release

# Three ways this workflow fires:
#   1. `scripts/release.sh` opens a release PR that bumps
#      `package.json`. When that PR merges to `main`, the push event
#      notices the version advance, tags the merge commit, and ships.
#      (Primary path.)
#   2. Pushing a tag `vX.Y.Z` directly skips the PR flow and ships.
#   3. `workflow_dispatch` from the Actions tab with a version input.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.3.0 — no `v` prefix)"
        required: true
        type: string

permissions:
  contents: write # Required to create releases and push tags.

jobs:
  resolve:
    # Figures out whether this run should actually release, and what
    # version/tag to use. For the `push: main` path we need to look at
    # package.json vs the latest tag — only advance when they differ.
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Need history + tags.
      - id: decide
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"

          if [ "$event" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$event" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `push: main` path — release only when the version in
          # package.json *changed in this push*. This is what
          # distinguishes a release-PR merge (version bumped) from
          # every other push to main (version unchanged). We never
          # auto-release a version that happened to already be sitting
          # in package.json — that'd mean the first push to `main`
          # after adding this workflow ships whatever version was
          # checked in, with no PR approval.
          before_sha="${{ github.event.before }}"
          after_sha="${{ github.event.after }}"

          # First push after repo creation has `before` = all zeros;
          # treat that as "no prior state" and do not release.
          if [[ "$before_sha" == "0000000000000000000000000000000000000000" || -z "$before_sha" ]]; then
            echo "First push on main has no prior version to compare; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          new_version="$(node -e 'console.log(require("./package.json").version)')"
          old_version="$(git show "$before_sha:package.json" 2>/dev/null | node -e 'let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{try{console.log(JSON.parse(s).version||"")}catch{console.log("")}})' || true)"

          if [ "$old_version" = "$new_version" ]; then
            echo "package.json version unchanged ($new_version); nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$new_version" ]; then
            echo "::error::could not read version from package.json"
            exit 1
          fi

          candidate_tag="v$new_version"
          if git rev-parse -q --verify "refs/tags/$candidate_tag" >/dev/null 2>&1; then
            echo "::error::version advanced to $new_version but tag $candidate_tag already exists; aborting"
            exit 1
          fi

          echo "Version advanced $old_version -> $new_version; releasing as $candidate_tag."
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=$candidate_tag" >> "$GITHUB_OUTPUT"

  secret-scan:
    name: Scan release source
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve publication source
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare official Gitleaks image
        run: docker image inspect "$GITLEAKS_IMAGE" >/dev/null 2>&1 || docker pull "$GITLEAKS_IMAGE"
      - name: Scan publication history offline
        env:
          SCAN_HEAD: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep findings distinct from scanner-error statuses.
          readonly FINDINGS_EXIT_CODE=20
          readonly SCAN_TIMEOUT_SECONDS=300 # Leave time for checkout and image preparation.
          [[ $(git rev-parse HEAD) == "$SCAN_HEAD" ]]
          [[ $(git rev-parse --is-shallow-repository) == false ]]
          range=$SCAN_HEAD
          umask 077
          report=$(mktemp -d)
          trap 'rm -rf "$report"' EXIT
          mkdir "$report/objects"
          status=0
          docker run --rm --pull=never --network none --user "$(id -u):$(id -g)" \
            -e GIT_CONFIG_GLOBAL=/dev/null \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$report:/reports" \
            -e GIT_CONFIG_COUNT=3 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -e GIT_CONFIG_KEY_1=color.ui -e GIT_CONFIG_VALUE_1=false \
            -e GIT_CONFIG_KEY_2=color.diff -e GIT_CONFIG_VALUE_2=false \
            -e GIT_NO_REPLACE_OBJECTS=1 -e GIT_NO_LAZY_FETCH=1 \
            -e GIT_OBJECT_DIRECTORY=/reports/objects -e GIT_ALTERNATE_OBJECT_DIRECTORIES=/repo/.git/objects \
            "$GITLEAKS_IMAGE" git /repo \
            --log-opts="$range --full-history --diff-merges=remerge --text --no-ext-diff --no-textconv" \
            --redact=100 --no-banner --log-level error --timeout "$SCAN_TIMEOUT_SECONDS" --exit-code "$FINDINGS_EXIT_CODE" \
            --report-format json --report-path /reports/findings.json \
            >/dev/null 2>"$report/errors" || status=$?
          # Upstream can log a Git-source error while returning zero.
          if [[ "$status" == 125 || "$status" == 126 || "$status" == 127 ]]; then
            echo "Secret scan could not start Docker or Gitleaks (exit $status)." >&2
            exit 1
          elif [[ -s "$report/errors" || ( "$status" != 0 && "$status" != "$FINDINGS_EXIT_CODE" ) ]]; then
            category='scanner execution'
            if grep -Eiq 'config|toml|allowlist' "$report/errors"; then
              category='configuration'
            elif grep -Eiq 'permission denied|read-only file system|report|no such file' "$report/errors"; then
              category='filesystem/report'
            elif grep -Eiq 'git|repository|revision|object|fatal:' "$report/errors"; then
              category='Git history'
            fi
            echo "Secret scan error: $category (exit $status); raw diagnostics are withheld." >&2
            exit 1
          fi
          jq -c '.[] | {rule: .RuleID, line: .StartLine, commit: .Commit}' "$report/findings.json"
          count=$(jq length "$report/findings.json")
          echo "Secret scan: Gitleaks found $count potential finding(s). See docs/secret-scanning.md for remediation and native exceptions."
          if [[ "$status" == "$FINDINGS_EXIT_CODE" ]]; then
            echo '::warning::Historical publication findings are temporarily warning-only; PR and pushed-range findings still block.'
            exit 0
          fi
          exit "$status"

  build-and-release:
    needs: [resolve, secret-scan]
    if: needs.resolve.outputs.should_release == 'true' && needs.secret-scan.result == 'success'
    # Bun cross-compiles cleanly, so a Linux runner builds every
    # supported binary and saves on GitHub minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.secret-scan.outputs.commit }}
          fetch-depth: 0

      # When the trigger isn't a tag push, create the tag pointing at
      # the current commit so `softprops/action-gh-release` has
      # something to release. Pushing the tag inside this same workflow
      # run doesn't trigger a recursive Release workflow run (a
      # deliberate GitHub Actions safeguard), which is what we want.
      - name: Create tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.resolve.outputs.tag }}"
          git push origin "${{ needs.resolve.outputs.tag }}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Safety gate: never ship a build that can't pass the full check.
      - name: Typecheck, lint, test
        run: bun run check
        env:
          # See ci.yml for why this is needed on Linux runners.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "protocol.file.allow"
          GIT_CONFIG_VALUE_0: "always"

      - name: Verify package version matches tag
        run: |
          pkg_version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$pkg_version" != "${{ needs.resolve.outputs.version }}" ]; then
            echo "::error::package.json version ($pkg_version) does not match release tag version (${{ needs.resolve.outputs.version }})"
            exit 1
          fi

      - name: Build macOS arm64
        run: |
          bun build --compile --minify --sourcemap \
            --target=bun-darwin-arm64 \
            src/index.ts --outfile dist/crew-macos-arm64

      - name: Build macOS x64
        run: |
          bun build --compile --minify --sourcemap \
            --target=bun-darwin-x64 \
            src/index.ts --outfile dist/crew-macos-x64

      - name: Build Linux arm64
        run: |
          bun build --compile --minify --sourcemap \
            --target=bun-linux-arm64 \
            src/index.ts --outfile dist/crew-linux-arm64

      - name: Build Linux x64
        run: |
          bun build --compile --minify --sourcemap \
            --target=bun-linux-x64 \
            src/index.ts --outfile dist/crew-linux-x64

      - name: Generate checksums
        working-directory: dist
        run: sha256sum crew-macos-arm64 crew-macos-x64 crew-linux-arm64 crew-linux-x64 > SHA256SUMS

      - name: Sign checksums
        working-directory: dist
        env:
          CREW_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.CREW_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CREW_RELEASE_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::CREW_RELEASE_SIGNING_PRIVATE_KEY secret is required"
            exit 1
          fi
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$CREW_RELEASE_SIGNING_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          openssl dgst -sha256 -sign "$key_file" -out SHA256SUMS.sig SHA256SUMS

      # Immutable releases require all assets to be attached before the
      # release is published. Create a draft, upload every asset, then
      # publish it as the final step.
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/crew-macos-arm64
            dist/crew-macos-x64
            dist/crew-linux-arm64
            dist/crew-linux-x64
            dist/SHA256SUMS
            dist/SHA256SUMS.sig

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.resolve.outputs.tag }}" --draft=false
