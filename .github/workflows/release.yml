name: Release

# Three ways this workflow fires:
#   1. `scripts/release.sh` opens a release PR that bumps
#      `package.json`. When that PR merges to `main`, the push event
#      notices the version advance, tags the merge commit, and ships.
#      (Primary path.)
#   2. Pushing a tag `vX.Y.Z` directly skips the PR flow and ships.
#   3. `workflow_dispatch` from the Actions tab with a version input.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.3.0 — no `v` prefix)"
        required: true
        type: string

permissions:
  contents: write # Required to create releases and push tags.

jobs:
  resolve:
    # Figures out whether this run should actually release, and what
    # version/tag to use. For the `push: main` path we need to look at
    # package.json vs the latest tag — only advance when they differ.
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need history + tags.
      - id: decide
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"

          if [ "$event" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$event" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `push: main` path — release only when package.json version
          # is newer than any existing tag.
          pkg_version="$(node -e 'console.log(require("./package.json").version)')"
          candidate_tag="v$pkg_version"
          if git rev-parse -q --verify "refs/tags/$candidate_tag" >/dev/null 2>&1; then
            echo "Tag $candidate_tag already exists — nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version $pkg_version is new; releasing as $candidate_tag."
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          echo "tag=$candidate_tag" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    # Bun cross-compiles cleanly, so a Linux runner builds both macOS
    # binaries and saves on GitHub minutes (Ubuntu is 10x cheaper than
    # macOS).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # When the trigger isn't a tag push, create the tag pointing at
      # the current commit so `softprops/action-gh-release` has
      # something to release. Pushing the tag inside this same workflow
      # run doesn't trigger a recursive Release workflow run (a
      # deliberate GitHub Actions safeguard), which is what we want.
      - name: Create tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.resolve.outputs.tag }}"
          git push origin "${{ needs.resolve.outputs.tag }}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Safety gate: never ship a build that can't pass the full check.
      - name: Typecheck, lint, test
        run: bun run check
        env:
          # See ci.yml for why this is needed on Linux runners.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "protocol.file.allow"
          GIT_CONFIG_VALUE_0: "always"

      - name: Verify package version matches tag
        run: |
          pkg_version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$pkg_version" != "${{ needs.resolve.outputs.version }}" ]; then
            echo "::error::package.json version ($pkg_version) does not match release tag version (${{ needs.resolve.outputs.version }})"
            exit 1
          fi

      - name: Build macOS arm64
        run: |
          bun build --compile --minify --sourcemap \
            --target=bun-darwin-arm64 \
            src/index.ts --outfile dist/crew-macos-arm64

      - name: Build macOS x64
        run: |
          bun build --compile --minify --sourcemap \
            --target=bun-darwin-x64 \
            src/index.ts --outfile dist/crew-macos-x64

      - name: Generate checksums
        working-directory: dist
        run: sha256sum crew-macos-arm64 crew-macos-x64 > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/crew-macos-arm64
            dist/crew-macos-x64
            dist/SHA256SUMS
