# Claude Code PR review + mention responder.
#
# On PR open, posts a review grounded in CLAUDE.md's working agreement
# and standards. On @claude mentions in PR comments/reviews/inline
# review comments, lets Claude respond to the user's request directly.
name: Claude Code

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-review-pr:
    name: "Claude: Review new PR"
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Read PR review prompt
        id: read-prompt
        run: |
          {
            echo 'prompt<<EOF'
            cat .github/pr-review-prompt.md
            echo
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Run Claude Code - Review PR
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: dependabot[bot]
          prompt: ${{ steps.read-prompt.outputs.prompt }}
          path_to_bun_executable: ~/.bun/bin/bun
          track_progress: 'true'
          claude_args: |
            --model claude-sonnet-4-6
            --allowedTools Bash,View,WebFetch,WebSearch,Glob,Grep

  claude-mention:
    name: "Claude: Respond to mention"
    if: |
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        (github.event.review.author_association == 'OWNER' ||
          github.event.review.author_association == 'MEMBER' ||
          github.event.review.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # `issue_comment` and review events run in the base repository context.
      # Keep the privileged job on trusted repository bytes; Claude can inspect
      # the PR through GitHub APIs instead of executing code from the PR head.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          path_to_bun_executable: ~/.bun/bin/bun
          claude_args: |
            --model claude-sonnet-4-6
            --allowedTools Bash,Read,View,Edit,Write,MultiEdit,WebFetch,WebSearch,Glob,Grep
