name: Secret scanning
on:
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    name: ${{ github.event_name == 'pull_request_target' && 'Secret scan guidance' || 'Secret scan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
      SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
    steps:
      # PR files are data only: no project scripts, dependencies, or local actions run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SCAN_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare official Gitleaks image
        run: docker image inspect "$GITLEAKS_IMAGE" >/dev/null 2>&1 || docker pull "$GITLEAKS_IMAGE"
      - name: Scan committed changes offline
        id: scan
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          readonly FINDINGS_EXIT_CODE=20
          readonly SCAN_TIMEOUT_SECONDS=300 # Leave time for checkout and image preparation.
          [[ $(git rev-parse HEAD) == "$SCAN_HEAD" ]]
          [[ $(git rev-parse --is-shallow-repository) == false ]]
          if [[ "$GITHUB_EVENT_NAME" == pull_request* || "$GITHUB_EVENT_NAME" == merge_group ]]; then
            [[ "$SCAN_BASE" =~ ^[a-fA-F0-9]{40}$ && ! "$SCAN_BASE" =~ ^0+$ ]] || {
              echo 'Secret scan requires the PR or merge-queue base commit.' >&2
              exit 1
            }
          fi
          range=$SCAN_HEAD
          if [[ -n "$SCAN_BASE" && ! "$SCAN_BASE" =~ ^0+$ ]]; then
            if git cat-file -e "$SCAN_BASE^{commit}" 2>/dev/null; then
              range="$SCAN_BASE..$SCAN_HEAD"
            elif [[ "$GITHUB_EVENT_NAME" == pull_request* || "$GITHUB_EVENT_NAME" == merge_group ]]; then
              echo 'Secret scan could not resolve the PR or merge-queue base.' >&2
              exit 1
            fi
          fi
          umask 077
          report=$(mktemp -d)
          trap 'rm -rf "$report"' EXIT
          mkdir "$report/objects"
          status=0
          docker run --rm --pull=never --network none --user "$(id -u):$(id -g)" \
            -e GIT_CONFIG_GLOBAL=/dev/null \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$report:/reports" \
            -e GIT_CONFIG_COUNT=3 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -e GIT_CONFIG_KEY_1=color.ui -e GIT_CONFIG_VALUE_1=false \
            -e GIT_CONFIG_KEY_2=color.diff -e GIT_CONFIG_VALUE_2=false \
            -e GIT_NO_REPLACE_OBJECTS=1 -e GIT_NO_LAZY_FETCH=1 \
            -e GIT_OBJECT_DIRECTORY=/reports/objects -e GIT_ALTERNATE_OBJECT_DIRECTORIES=/repo/.git/objects \
            "$GITLEAKS_IMAGE" git /repo \
            --log-opts="$range --full-history --diff-merges=remerge --text --no-ext-diff --no-textconv" \
            --redact=100 --no-banner --log-level error --timeout "$SCAN_TIMEOUT_SECONDS" --exit-code "$FINDINGS_EXIT_CODE" \
            --report-format json --report-path /reports/findings.json \
            >/dev/null 2>"$report/errors" || status=$?
          # Upstream can log a Git-source error while returning zero.
          if [[ "$status" == 125 || "$status" == 126 || "$status" == 127 ]]; then
            echo "Secret scan could not start Docker or Gitleaks (exit $status)." >&2
            exit 1
          elif [[ -s "$report/errors" || ( "$status" != 0 && "$status" != "$FINDINGS_EXIT_CODE" ) ]]; then
            category='scanner execution'
            if grep -Eiq 'config|toml|allowlist' "$report/errors"; then
              category='configuration'
            elif grep -Eiq 'permission denied|read-only file system|report|no such file' "$report/errors"; then
              category='filesystem/report'
            elif grep -Eiq 'git|repository|revision|object|fatal:' "$report/errors"; then
              category='Git history'
            fi
            echo "Secret scan error: $category (exit $status); raw diagnostics are withheld." >&2
            exit 1
          fi
          jq -c '.[] | {rule: .RuleID, file: .File, line: .StartLine, commit: .Commit, "ignore-id": .Fingerprint}' "$report/findings.json"
          count=$(jq length "$report/findings.json")
          echo "finding-count=$count" >> "$GITHUB_OUTPUT"
          echo "Gitleaks: $count potential finding(s). See docs/secret-scanning.md for remediation and native exceptions."
          exit "$status"
      - name: Explain findings or scan errors on the PR
        if: always() && github.event_name == 'pull_request_target' && steps.scan.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FINDING_COUNT: ${{ steps.scan.outputs.finding-count }}
        run: |
          if ! current_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq 'select(.state == "open") | .head.sha' 2>/dev/null); then
            echo 'Secret scan could not verify the current PR head before commenting.' >&2
            exit 1
          fi
          [[ "$current_head" == "$SCAN_HEAD" ]] || exit 0
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          cat > "$body" <<EOF_COMMENT
          Secret scan of commit $SCAN_HEAD: ${FINDING_COUNT:-unknown} potential finding(s). A failed scanner provides no clean result. Pattern matches do not prove a credential is live or private.

          [Open the scan log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for redacted rule, location, commit, and Ignore ID metadata.

          - **Real credential:** rotate it if exposed, then remove it from every introducing PR commit. A later deletion leaves history detectable.
          - **Verified public/test value:** add a narrow, reviewed native repository exception in .gitleaks.toml or .gitleaksignore.
          - **Scanner error:** repair the checkout, image/runtime, or configuration problem and rerun. An exception does not fix a failed scan.

          See docs/secret-scanning.md in this repository. Inspect values privately; do not paste credentials into comments.
          EOF_COMMENT
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"
      - name: Require a completed clean scan
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: test "$SCAN_OUTCOME" = success
